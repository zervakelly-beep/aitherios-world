
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ΑΙΘΕΡΙΟΣ | Enchanted Nature World</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #071b2d;
}
#panel {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 2;
  color: white;
  background: #102b46dd;
  border: 1px solid #8be6dc;
  border-radius: 14px;
  padding: 17px 22px;
  pointer-events: none;
}
#panel h2 { margin: 0 0 8px; color: #8be6dc; }
#panel p { margin: 5px 0; font-size: 13px; }
#hint {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  background: #102b46bb;
  padding: 10px 16px;
  border-radius: 20px;
  font-size: 12px;
  pointer-events: none;
}
</style>
</head>
<body>

<div id="panel">
  <h2>✦ ΑΙΘΕΡΙΟΣ</h2>
  <p>Ένας κόσμος φυσικής ομορφιάς και μαγείας</p>
  <p>Σύρε το ποντίκι για να εξερευνήσεις</p>
  <p>Ροδέλα: Κοντινή και μακρινή θέα</p>
</div>
<div id="hint">Καλώς ήρθες στον μαγικό φυσικό κόσμο του ΑΙΘΕΡΙΟΥ</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91cde8);
scene.fog = new THREE.Fog(0x91cde8, 45, 115);

const camera = new THREE.PerspectiveCamera(
  55, innerWidth / innerHeight, 0.1, 250
);
camera.position.set(24, 22, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 3, 0);
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 8;
controls.maxDistance = 75;

// Φυσικός φωτισμός
scene.add(new THREE.HemisphereLight(0xdaf3ff, 0x526c42, 2));

const sun = new THREE.DirectionalLight(0xffe8bc, 3);
sun.position.set(-25, 35, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

// Θάλασσα
const sea = new THREE.Mesh(
  new THREE.CircleGeometry(90, 96),
  new THREE.MeshStandardMaterial({
    color: 0x168eaf,
    roughness: 0.25,
    metalness: 0.25
  })
);
sea.rotation.x = -Math.PI / 2;
sea.position.y = -2;
scene.add(sea);

// Μεγάλο φυσικό νησί
const ground = new THREE.Mesh(
  new THREE.CylinderGeometry(23, 26, 3, 96),
  new THREE.MeshStandardMaterial({
    color: 0x548d48,
    roughness: 1
  })
);
ground.position.y = -0.6;
ground.receiveShadow = true;
scene.add(ground);

// Πράσινο έδαφος
const meadow = new THREE.Mesh(
  new THREE.CircleGeometry(23, 96),
  new THREE.MeshStandardMaterial({
    color: 0x79b95e,
    roughness: 1
  })
);
meadow.rotation.x = -Math.PI / 2;
meadow.position.y = 0.93;
meadow.receiveShadow = true;
scene.add(meadow);

// Βουνά με χιονισμένες κορυφές
function mountain(x, z, radius, height) {
  const group = new THREE.Group();

  const rock = new THREE.Mesh(
    new THREE.ConeGeometry(radius, height, 7),
    new THREE.MeshStandardMaterial({
      color: 0x687c70,
      flatShading: true
    })
  );
  rock.position.y = height / 2;
  rock.castShadow = true;
  group.add(rock);

  const snow = new THREE.Mesh(
    new THREE.ConeGeometry(radius * 0.43, height * 0.38, 7),
    new THREE.MeshStandardMaterial({
      color: 0xf1f6ed,
      flatShading: true
    })
  );
  snow.position.y = height * 0.82;
  group.add(snow);

  group.position.set(x, 0.8, z);
  scene.add(group);
}

mountain(-13, -12, 8, 19);
mountain(-3, -16, 10, 24);
mountain(9, -13, 8, 20);
mountain(16, -5, 6, 15);
mountain(-17, 0, 6, 14);

// Κεντρική κρυστάλλινη λίμνη
const lake = new THREE.Mesh(
  new THREE.CircleGeometry(7, 64),
  new THREE.MeshPhysicalMaterial({
    color: 0x35c4d7,
    roughness: 0.12,
    metalness: 0.2,
    transparent: true,
    opacity: 0.92
  })
);
lake.rotation.x = -Math.PI / 2;
lake.position.set(0, 1.03, -5);
scene.add(lake);

// Ποτάμι
const riverPath = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 1.08, -10),
  new THREE.Vector3(2, 1.08, -7),
  new THREE.Vector3(5, 1.08, -3),
  new THREE.Vector3(4, 1.08, 2),
  new THREE.Vector3(8, 1.08, 7),
  new THREE.Vector3(12, 1.08, 12)
]);

const river = new THREE.Mesh(
  new THREE.TubeGeometry(riverPath, 80, 0.65, 10, false),
  new THREE.MeshStandardMaterial({
    color: 0x42c6e0,
    roughness: 0.2,
    metalness: 0.25
  })
);
scene.add(river);

// Καταρράκτες
const waterfalls = [];

function waterfall(x, y, z, height) {
  const water = new THREE.Mesh(
    new THREE.PlaneGeometry(2.3, height),
    new THREE.MeshBasicMaterial({
      color: 0x9cefff,
      transparent: true,
      opacity: 0.78,
      side: THREE.DoubleSide
    })
  );
  water.position.set(x, y, z);
  scene.add(water);
  waterfalls.push(water);

  const pool = new THREE.Mesh(
    new THREE.CircleGeometry(2.2, 32),
    new THREE.MeshStandardMaterial({
      color: 0x54c9e3,
      roughness: 0.2
    })
  );
  pool.rotation.x = -Math.PI / 2;
  pool.position.set(x, 1.04, z + 1.5);
  scene.add(pool);
}

waterfall(-4, 4.5, -10, 7);
waterfall(7, 3.5, -11, 5);

// Δέντρα
const trees = [];

function tree(x, z, scale = 1) {
  const group = new THREE.Group();

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.17, 0.3, 2, 8),
    new THREE.MeshStandardMaterial({ color: 0x795032 })
  );
  trunk.position.y = 1.7;
  trunk.castShadow = true;
  group.add(trunk);

  for (let i = 0; i < 3; i++) {
    const leaves = new THREE.Mesh(
      new THREE.ConeGeometry(1.3 - i * 0.2, 2.2, 9),
      new THREE.MeshStandardMaterial({
        color: i === 1 ? 0x347e43 : 0x55a85b,
        flatShading: true
      })
    );
    leaves.position.y = 2.3 + i * 1.1;
    leaves.castShadow = true;
    group.add(leaves);
  }

  group.position.set(x, 0.95, z);
  group.scale.setScalar(scale);
  scene.add(group);
  trees.push(group);
}

for (let i = 0; i < 65; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 9 + Math.random() * 12;
  const x = Math.cos(angle) * radius;
  const z = Math.sin(angle) * radius;

  if (Math.hypot(x, z + 5) < 8) continue;
  tree(x, z, 0.65 + Math.random() * 0.65);
}

// Βράχια
for (let i = 0; i < 45; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 5 + Math.random() * 17;

  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.3 + Math.random() * 0.65),
    new THREE.MeshStandardMaterial({
      color: 0x8b9887,
      flatShading: true
    })
  );
  rock.position.set(
    Math.cos(angle) * radius,
    1.1,
    Math.sin(angle) * radius
  );
  rock.castShadow = true;
  scene.add(rock);
}

// Αγριολούλουδα
const flowerColors = [0xffe7a0, 0xf4a4ca, 0xffffff, 0xa99af2];

for (let i = 0; i < 180; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 5 + Math.random() * 16;
  const x = Math.cos(angle) * radius;
  const z = Math.sin(angle) * radius;

  const flower = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 7, 7),
    new THREE.MeshStandardMaterial({
      color: flowerColors[i % flowerColors.length],
      emissive: flowerColors[i % flowerColors.length],
      emissiveIntensity: 0.12
    })
  );
  flower.position.set(x, 1.2 + Math.random() * 0.2, z);
  scene.add(flower);
}

// Μαγικά φωτεινά σωματίδια
const particleCount = 180;
const positions = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount; i++) {
  positions[i * 3] = (Math.random() - 0.5) * 40;
  positions[i * 3 + 1] = 1 + Math.random() * 12;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 40;
}

const particleGeometry = new THREE.BufferGeometry();
particleGeometry.setAttribute(
  'position',
  new THREE.BufferAttribute(positions, 3)
);

const particles = new THREE.Points(
  particleGeometry,
  new THREE.PointsMaterial({
    color: 0xffefaa,
    size: 0.16,
    transparent: true,
    opacity: 0.85
  })
);
scene.add(particles);

// Απαλά σύννεφα
const clouds = [];

for (let i = 0; i < 12; i++) {
  const cloud = new THREE.Group();

  for (let j = 0; j < 5; j++) {
    const puff = new THREE.Mesh(
      new THREE.SphereGeometry(1.5 + Math.random(), 12, 10),
      new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 1
      })
    );
    puff.position.set(j * 1.3 - 2.5, Math.random(), 0);
    puff.scale.y = 0.55;
    cloud.add(puff);
  }

  cloud.position.set(
    (Math.random() - 0.5) * 100,
    24 + Math.random() * 12,
    (Math.random() - 0.5) * 80
  );

  scene.add(cloud);
  clouds.push(cloud);
}

// Κινούμενη ατμόσφαιρα
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();

  controls.update();

  particles.rotation.y = t * 0.025;

  waterfalls.forEach((w, i) => {
    w.material.opacity = 0.65 + Math.sin(t * 3 + i) * 0.12;
  });

  clouds.forEach((cloud, i) => {
    cloud.position.x += 0.003 + i * 0.0001;
    if (cloud.position.x > 60) cloud.position.x = -60;
  });

  trees.forEach((tree, i) => {
    tree.rotation.z = Math.sin(t * 0.7 + i) * 0.012;
  });

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
