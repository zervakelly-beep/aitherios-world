
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Αιθέριος | Virtual World</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  background: #071b2d;
  font-family: Arial, sans-serif;
}
#info {
  position: fixed;
  top: 20px;
  left: 20px;
  color: white;
  background: #102b46dd;
  padding: 16px 20px;
  border: 1px solid #75d9ed;
  border-radius: 12px;
  z-index: 2;
}
#info h2 { margin: 0 0 7px; color: #79e5f5; }
#info p { margin: 5px 0; font-size: 13px; }
#loading {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  color: white;
  background: #071b2d;
  z-index: 5;
}
</style>
</head>
<body>

<div id="loading">Ο ΑΙΘΕΡΙΟΣ δημιουργείται...</div>
<div id="info">
  <h2>✦ ΑΙΘΕΡΙΟΣ</h2>
  <p>Καλώς ήρθες στον δικό σου κόσμο!</p>
  <p>W A S D ή βελάκια: Κίνηση</p>
  <p>Ποντίκι: Περιστροφή κάμερας</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x86c9e8);
scene.fog = new THREE.Fog(0x86c9e8, 35, 100);

const camera = new THREE.PerspectiveCamera(
  60, window.innerWidth / window.innerHeight, 0.1, 200
);
camera.position.set(13, 12, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 7;
controls.maxDistance = 35;

// Φωτισμός
scene.add(new THREE.HemisphereLight(0xffffff, 0x45634a, 2));

const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(-10, 20, 10);
sun.castShadow = true;
scene.add(sun);

// Νερό
const water = new THREE.Mesh(
  new THREE.CircleGeometry(48, 80),
  new THREE.MeshStandardMaterial({
    color: 0x269ebc, roughness: 0.35, metalness: 0.15
  })
);
water.rotation.x = -Math.PI / 2;
water.position.y = -1.3;
scene.add(water);

// Κεντρικό νησί
const island = new THREE.Mesh(
  new THREE.CylinderGeometry(13, 15, 2.2, 64),
  new THREE.MeshStandardMaterial({ color: 0x63a64e, roughness: 1 })
);
island.position.y = -0.1;
island.receiveShadow = true;
island.castShadow = true;
scene.add(island);

// Λόφος
const hill = new THREE.Mesh(
  new THREE.SphereGeometry(5, 32, 24),
  new THREE.MeshStandardMaterial({ color: 0x80bd58 })
);
hill.position.set(-4, 1.4, -4);
hill.scale.y = 0.55;
hill.receiveShadow = true;
scene.add(hill);

// Κεντρική πλατεία
const plaza = new THREE.Mesh(
  new THREE.CircleGeometry(4, 48),
  new THREE.MeshStandardMaterial({ color: 0xd9c49a })
);
plaza.rotation.x = -Math.PI / 2;
plaza.position.y = 1.02;
scene.add(plaza);

// Μικρό κτίριο
const building = new THREE.Group();
const walls = new THREE.Mesh(
  new THREE.BoxGeometry(3.5, 2.5, 3),
  new THREE.MeshStandardMaterial({ color: 0xf0d7ad })
);
walls.position.y = 2.25;
walls.castShadow = true;
building.add(walls);

const roof = new THREE.Mesh(
  new THREE.ConeGeometry(2.8, 2, 4),
  new THREE.MeshStandardMaterial({ color: 0x9c5142 })
);
roof.position.y = 4.5;
roof.rotation.y = Math.PI / 4;
roof.castShadow = true;
building.add(roof);
building.position.set(5, 0, -5);
scene.add(building);

// Δέντρα
function createTree(x, z, scale = 1) {
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18, 0.28, 1.5, 8),
    new THREE.MeshStandardMaterial({ color: 0x80502e })
  );
  trunk.position.y = 1.7;
  trunk.castShadow = true;
  tree.add(trunk);

  for (let i = 0; i < 3; i++) {
    const leaves = new THREE.Mesh(
      new THREE.ConeGeometry(1.15 - i * 0.12, 1.7, 9),
      new THREE.MeshStandardMaterial({ color: i === 1 ? 0x32844c : 0x4caa5c })
    );
    leaves.position.y = 2.5 + i * 0.75;
    leaves.castShadow = true;
    tree.add(leaves);
  }

  tree.position.set(x, 0, z);
  tree.scale.setScalar(scale);
  scene.add(tree);
}

[
  [-9,-5],[-10,2],[-7,8],[1,-10],[9,-8],
  [10,1],[8,8],[-3,10],[3,8],[-10,-1]
].forEach(([x,z],i) => createTree(x,z, i%3===0 ? 1.2 : 0.85));

// Διακοσμητικές πέτρες
for (let i = 0; i < 22; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 6 + Math.random() * 6;
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.35 + Math.random()*0.4, 0),
    new THREE.MeshStandardMaterial({ color: 0x8c9889 })
  );
  rock.position.set(Math.cos(a)*r, 0.8, Math.sin(a)*r);
  rock.castShadow = true;
  scene.add(rock);
}

// Παίκτης
const player = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.4, 0.8, 4, 8),
  new THREE.MeshStandardMaterial({ color: 0x3978d5 })
);
body.position.y = 1.1;
body.castShadow = true;
player.add(body);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.34, 20, 16),
  new THREE.MeshStandardMaterial({ color: 0xffd1a6 })
);
head.position.y = 1.9;
head.castShadow = true;
player.add(head);

player.position.set(0, 1, 0);
scene.add(player);

// Χειρισμός κίνησης
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

function animate() {
  requestAnimationFrame(animate);

  const speed = 0.09;
  let dx = 0, dz = 0;

  if (keys['w'] || keys['arrowup']) dz -= speed;
  if (keys['s'] || keys['arrowdown']) dz += speed;
  if (keys['a'] || keys['arrowleft']) dx -= speed;
  if (keys['d'] || keys['arrowright']) dx += speed;

  player.position.x += dx;
  player.position.z += dz;

  const distance = Math.hypot(player.position.x, player.position.z);
  if (distance > 10) {
    player.position.x *= 10 / distance;
    player.position.z *= 10 / distance;
  }

  controls.target.set(
    player.position.x, 1, player.position.z
  );
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById('loading').remove();
animate();
</script>
</body>
</html>
